server:
  http_listen_port: 9080

positions:
  filename: /positions/positions.yaml

clients:
  - url: ${LOKI_URL}

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ['otel.logs.scrape=true']
    relabel_configs:
      - source_labels: [__meta_docker_container_label_otel_service_name]
        target_label: service_name
      - source_labels: [__meta_docker_container_label_otel_service_name]
        target_label: job
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container_name
    pipeline_stages:
      # hello-api (pino) logs are JSON with numeric levels; map to a text label.
      # order-api logs are plain text with the level already in the line, so
      # they skip this pipeline and Loki's detected_level takes over.
      - match:
          selector: '{job="hello-elysia"}'
          stages:
            - json:
                expressions:
                  level: level
            - template:
                source: level
                template: '{{ if eq .Value "60" }}FATAL{{ else if eq .Value "50" }}ERROR{{ else if eq .Value "40" }}WARN{{ else if eq .Value "30" }}INFO{{ else if eq .Value "20" }}DEBUG{{ else }}TRACE{{ end }}'
            - labels:
                level:
