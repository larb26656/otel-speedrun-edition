# Overlay for stdout log mode: disables the apps' OTLP log exporters and
# deploys promtail to scrape container stdout (docker_sd, label-filtered).
# Usage: docker compose -f docker-compose.yml -f docker-compose.stdout.yml up -d
# Traces and metrics still use OTLP push in this mode.
services:
  hello-api:
    environment:
      OTEL_LOGS_EXPORTER: none
    labels:
      otel.logs.scrape: 'true'
      otel.service.name: hello-elysia

  order-api:
    environment:
      MANAGEMENT_OTLP_LOGGING_EXPORT_ENABLED: 'false'
    labels:
      otel.logs.scrape: 'true'
      otel.service.name: order-api

  promtail:
    image: grafana/promtail:3.3.2
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    environment:
      LOKI_URL: http://lgtm:3100/loki/api/v1/push
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/positions
    restart: unless-stopped

volumes:
  promtail-data:
